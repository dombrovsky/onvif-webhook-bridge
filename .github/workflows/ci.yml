name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
      version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.402
      - run: ./tests/Verify-Workflows.ps1
        shell: pwsh
      - name: Release automation regression and source version
        env:
          SELECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 -m unittest discover -s tests -p 'test_release.py' -v
          version=$(python3 build/release.py version --version "$SELECTED_VERSION")
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet restore OnvifWebhookBridge.slnx
      - run: dotnet format whitespace OnvifWebhookBridge.slnx --verify-no-changes --no-restore
      - run: dotnet build OnvifWebhookBridge.slnx --no-restore -m:1
      - run: ./tests/Build-OnvifSimulator.ps1
        shell: pwsh
      - run: dotnet test OnvifWebhookBridge.slnx --no-build --no-restore
      - run: ./tests/OnvifProbe.Smoke.ps1
        shell: pwsh
      - run: ./tests/Verify-Phase7Native.ps1 -Platform linux/${{ matrix.arch }}
        shell: pwsh
      - run: docker build --platform linux/${{ matrix.arch }} --build-arg GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" --build-arg VERSION="$BUILD_VERSION" --build-arg REVISION="$(git rev-parse HEAD)" -t onvif-webhook-bridge:verify .
      - name: Browser tooling (test only)
        if: matrix.arch == 'amd64'
        run: |
          npm install --prefix .local/browser playwright@1.62.1
          .local/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Production deployment and Compose
        shell: pwsh
        env:
          ONVIF_BROWSER_CHANNEL: chromium
        run: |
          $browser = if ('${{ matrix.arch }}' -eq 'amd64') { "$PWD/.local/browser/node_modules/playwright" } else { '' }
          ./tests/Verify-Deployment.ps1 -Image onvif-webhook-bridge:verify -Platform linux/${{ matrix.arch }} -SoakSeconds 600 -PlaywrightModule $browser
          ./tests/Verify-Compose.ps1 -Image onvif-webhook-bridge:verify -PlaywrightModule $browser
          ./tests/Verify-InboundTls.ps1 -Image onvif-webhook-bridge:verify -Platform linux/${{ matrix.arch }}
      - name: Browser regression
        if: matrix.arch == 'amd64'
        shell: pwsh
        env:
          ONVIF_BROWSER_CHANNEL: chromium
        run: ./tests/Verify-Phase7Browser.ps1 -PlaywrightModule "$PWD/.local/browser/node_modules/playwright"
      - name: Export tested platform image
        run: |
          python3 build/release.py export --version "$BUILD_VERSION" --revision "$(git rev-parse HEAD)" --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.arch }}
          path: |
            image-${{ matrix.arch }}.tar
            image-${{ matrix.arch }}.json
          retention-days: 7
