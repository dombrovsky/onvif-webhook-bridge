name: Release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full 40-character commit SHA from protected main to build and release'
        required: true
        type: string
permissions:
  contents: read
# All versions share latest and the same registries. Never cancel an active publisher.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 10
    steps:
      - name: Require main dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo 'Run Release from main in the Actions branch selector.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version from selected source
        id: release
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          version=$(python3 build/release.py version --revision "$REVISION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version from Directory.Build.props: $version" >> "$GITHUB_STEP_SUMMARY"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate source, protection and unused version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ inputs.revision }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: python3 build/release.py preflight --version "$VERSION" --revision "$REVISION" --namespace "$NAMESPACE"
  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.revision }}
      version: ${{ needs.preflight.outputs.version }}
    permissions:
      contents: read
  publish:
    needs: [preflight, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested content to both registries and finalize release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          REVISION: ${{ inputs.revision }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: python3 build/release.py publish --version "$VERSION" --revision "$REVISION" --namespace "$NAMESPACE"
      - name: Preserve publication evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: release-oci/release.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Explain incomplete publication
        if: failure()
        run: |
          echo 'Release incomplete. Check the failed step, any reserved tag/draft, both registries and stable latest aliases. Never overwrite an existing version. See docs/DEPLOYMENT.md#recovering-a-failed-release.' >> "$GITHUB_STEP_SUMMARY"
