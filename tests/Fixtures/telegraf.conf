[agent]
  interval = "1s"
  flush_interval = "100ms"
  flush_jitter = "0s"
  omit_hostname = true
  quiet = true

[[inputs.opentelemetry]]
  service_address = "0.0.0.0:4317"
  metrics_schema = "prometheus-v2"

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
  expiration_interval = "30s"
